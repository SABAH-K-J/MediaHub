[project]
name = "cameodist"
version = "2.0.0"
description = "Self-contained local media library manager and player workspace"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S404", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = ["backend"]

